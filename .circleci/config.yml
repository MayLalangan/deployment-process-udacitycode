version: 2.1
orbs:
  node: circleci/node@5.0.2
  eb: circleci/aws-elastic-beanstalk@2.0.1
  aws-cli: circleci/aws-cli@3.1.1

jobs:
  build:
    docker:
      - image: "cimg/node:14.15"
    steps:
      - node/install:
          node-version: '14.15'
      - checkout
      # Install Frontend
      - run:
          name: Install Front-End Dependencies
          command: |
            cd udagram/udagram-frontend
            npm install -f
      # Install API
      - run:
          name: Install API Dependencies
          command: |
             cd udagram/udagram-api
             npm install
      # Lint Frontend
      - run:
          name: Front-End Lint
          command: |
            cd udagram/udagram-frontend
            npm run lint
      # Build Frontend
      - run:
          name: Front-End Build
          command: |
            cd udagram/udagram-frontend
            npm run build
      # Build API
      - run:
          name: API Build
          command: |
            cd udagram/udagram-api
            npm run build

  deploy:
    docker:
      - image: "cimg/base:stable"
    steps:
      - node/install:
          node-version: '14.15'
      - eb/setup
      - aws-cli/setup
      - checkout
      - run:
          name: Deploy App
          command: |
            # Deploy Frontend
            cd udagram/udagram-frontend
            npm run deploy
            # Deploy API
            cd ../udagram-api
            npm run deploy

workflows:
  udagram:
    jobs:
      - build
      - hold:
          filters:
            branches:
              only:
                - master
          type: approval
          requires:
            - build
      - deploy:
          requires:
            - hold