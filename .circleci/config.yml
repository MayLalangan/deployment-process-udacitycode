version: 2.1
orbs:
  node: circleci/node@5.0.2
  eb: circleci/aws-elastic-beanstalk@2.0.1
  aws-cli: circleci/aws-cli@3.1.1

jobs:
  build:
    docker:
      - image: "cimg/node:14.15"
    steps:
      - node/install:
          node-version: "14.15"
      - checkout
      # Install Frontend Dependencies
      - run:
          name: Install Front-End Dependencies
          command: npm run frontend:install
      # Install API Dependencies
      - run:
          name: Install API Dependencies
          command: npm run api:install
      # Lint the Frontend
      - run:
          name: Front-End Lint
          command: npm run frontend:lint
      # Build the Frontend
      - run:
          name: Front-End Build
          command: npm run frontend:build
      # Build the API
      - run:
          name: API Build
          command: npm run api:build

  deploy:
    docker:
      - image: "cimg/base:stable"
    steps:
      - node/install:
          node-version: "14.15"
      - eb/setup
      - aws-cli/setup
      - checkout
      - run:
          name: Deploy App
          # This runs 'npm run deploy' from the root package.json,
          # which triggers both api:deploy and frontend:deploy
          command: npm run deploy

workflows:
  udagram:
    jobs:
      - build
      - hold:
          filters:
            branches:
              only:
                - master  
          type: approval
          requires:
            - build
      - deploy:
          requires:
            - hold